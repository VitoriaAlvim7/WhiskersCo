spring.application.name=Back

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:whiskers}
spring.datasource.username=${POSTGRES_USER:whiskers}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

api.security.token.secret=${JWT_SECRET}
api.security.token.expiration.hours=48

api.security.cookie.secure=${COOKIE_SECURE:false}
api.security.cookie.samesite=${COOKIE_SAMESITE:Lax}

app.upload.diretorio=${UPLOAD_DIR:uploads}
app.upload.tamanho-maximo-bytes=2097152

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

app.cors.origens=${CORS_ORIGINS:http://localhost:4200}
app.estoque.minimo=${ESTOQUE_MINIMO:5}
