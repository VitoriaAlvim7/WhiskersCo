# Perfil de demonstracao: .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=demo"
#
# Usa o mesmo banco, mas num schema separado ("demo"). Os dados reais ficam no
# schema "public" e nao sao lidos nem alterados. A cada subida, o schema demo e
# recriado do zero, o seed-teste-dev.sql e carregado com as datas do dia e um
# login de demonstracao e criado (ver DemoConfig).

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:whiskers}?currentSchema=demo

spring.flyway.schemas=demo
spring.flyway.default-schema=demo
spring.flyway.create-schemas=true
spring.flyway.clean-disabled=false

spring.jpa.properties.hibernate.default_schema=demo
spring.jpa.show-sql=false

app.demo.seed=${DEMO_SEED:seed-teste-dev.sql}
app.demo.email=${DEMO_EMAIL:demo@whiskers.local}
app.demo.senha=${DEMO_SENHA:demo1234}
