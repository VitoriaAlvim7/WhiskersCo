# Produção (Coolify ou qualquer servidor com Docker): banco + API + site.
# Só o "front" precisa de domínio público; ele repassa /api e /uploads para a API.
#
# Variáveis obrigatórias: POSTGRES_PASSWORD, JWT_SECRET e CORS_ORIGINS (endereço do site).
# Opcional: COOKIE_SECURE (padrão true; use false se o site não tiver HTTPS).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=America/Sao_Paulo"]
    environment:
      POSTGRES_DB: whiskers
      POSTGRES_USER: whiskers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - whiskers_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whiskers -d whiskers"]
      interval: 5s
      timeout: 5s
      retries: 20

  back:
    build: ./Back
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: whiskers
      POSTGRES_USER: whiskers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      # Endereço público do site (ex.: https://whiskers.dominio.edu.br), sem barra no fim.
      # A API recusa requisições do navegador vindas de outro endereço.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8090}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: Lax
      UPLOAD_DIR: /app/uploads
      SPRING_JPA_SHOW_SQL: "false"
      TZ: America/Sao_Paulo
    volumes:
      - whiskers_uploads:/app/uploads

  front:
    build: ./Front
    restart: unless-stopped
    depends_on:
      - back

volumes:
  whiskers_pgdata:
  whiskers_uploads:
