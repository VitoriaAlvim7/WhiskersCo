server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fotos de até 2 MB (limite da API) mais o cabeçalho do envio.
    client_max_body_size 3m;

    # "^~" faz estas regras valerem antes da regra de imagens/estaticos abaixo.
    location ^~ /api/ {
        proxy_pass http://back:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /uploads/ {
        proxy_pass http://back:8080;
        proxy_set_header Host $host;
    }

    # Arquivos com hash no nome podem ficar em cache; o index.html não.
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
